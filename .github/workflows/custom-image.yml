name: Build custom container image (ghcr.io/alanfranz/writefreely)

# Builds Dockerfile.prod from the `custom` branch and publishes it as
# ghcr.io/<owner>/writefreely:<upstream-version>_<build-number>, e.g. 0.17.2_1, 0.17.2_2, ...
# plus the moving tags <major>.<minor>-latest (e.g. 0.17-latest) and latest.
# A weekly scheduled rebuild picks up base-image / Alpine / Go security fixes even
# without new commits (each rebuild gets the next build number).
#
# The build number is tracked with git tags named v<upstream-version>+<n> (e.g. v0.17.2+1).
# The "+n" form is valid semver build metadata, so the version the app reports
# (via `git describe` in the Makefile) stays comparable to upstream releases and the
# admin "update available" check keeps working. Docker tags can't contain "+", so the
# image tag uses "_" instead.

on:
  push:
    branches: [ custom ]
  workflow_dispatch:
  schedule:
    # Weekly rebuild, Mondays 04:17 UTC. Scheduled runs use the workflow file on
    # the default branch and build that branch.
    - cron: "17 4 * * 1"

# Serialize builds so two runs can never claim the same build number.
concurrency:
  group: custom-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/writefreely

jobs:
  build:
    # Never run in upstream or in other people's forks, and only ever publish the
    # `custom` branch (scheduled runs use the default branch, which must be `custom`).
    if: github.repository == 'alanfranz/writefreely' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the build-number tag
      packages: write   # push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags: needed for build numbering and `git describe`

      - name: Compute version and reserve build number
        id: version
        run: |
          base=$(sed -nE 's/^[[:space:]]*softwareVer[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app.go)
          if [[ ! $base =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read softwareVer from app.go (got '$base')"
            exit 1
          fi

          git fetch --tags --force origin
          max=0
          for t in $(git tag -l "v${base}+*"); do
            n=${t##*+}
            if [[ $n =~ ^[0-9]+$ ]] && (( n > max )); then
              max=$n
            fi
          done
          build=$((max + 1))

          git_tag="v${base}+${build}"
          image_tag="${base}_${build}"
          minor_tag="${base%.*}-latest"

          # Annotated tag on the commit being built: `git describe` (used by the
          # Makefile inside the Docker build) picks it up, so the binary reports
          # ${base}+${build} as its version.
          # Drop (locally only) any other tag on HEAD, e.g. from a previous build of the
          # same commit, so `git describe` can't pick that one instead.
          for t in $(git tag --points-at HEAD); do git tag -d "$t" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$git_tag" -m "Custom image build ${image_tag}"

          # Push the tag *before* building to reserve the number. If the build later
          # fails the number is simply skipped; a published image tag is never overwritten.
          git push origin "refs/tags/${git_tag}"

          echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "minor_tag=${minor_tag}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE_NAME}:${image_tag} (git tag ${git_tag}), also tagged ${minor_tag} and latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.image_tag }}
            type=raw,value=${{ steps.version.outputs.minor_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          # Local path context (not the git context) so .git, including the tag
          # created above, is available to `git describe` during the build.
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Deliberately no layer cache: the `apk upgrade` layers must be re-run on
          # every build so Alpine security fixes are always picked up.
